 <path d="M85 410 C45 590 115 710 65 900 C45 980 65 1060 30 1150" stroke-width="6"/>
 <path d="M1115 410 C1155 590 1085 710 1135 900 C1155 980 1135 1060 1170 1150" stroke-width="6"/>
</g>
<g fill="#83a7c6" opacity=".72">
 <ellipse cx="70" cy="520" rx="43" ry="19" transform="rotate(-25 70 520)"/><ellipse cx="100" cy="590" rx="46" ry="20" transform="rotate(28 100 590)"/>
 <ellipse cx="70" cy="670" rx="45" ry="20" transform="rotate(-28 70 670)"/><ellipse cx="95" cy="750" rx="46" ry="20" transform="rotate(28 95 750)"/>
 <ellipse cx="1130" cy="520" rx="43" ry="19" transform="rotate(25 1130 520)"/><ellipse cx="1100" cy="590" rx="46" ry="20" transform="rotate(-28 1100 590)"/>
 <ellipse cx="1130" cy="670" rx="45" ry="20" transform="rotate(28 1130 670)"/><ellipse cx="1105" cy="750" rx="46" ry="20" transform="rotate(-28 1105 750)"/>
</g>

<!-- BOTTOM LEFT / RIGHT lush bouquets -->
<g transform="translate(0 1800) scale(1 -1)">
 <g transform="translate(135 105) scale(1.65)"><use href="#flower"/></g>
 <g transform="translate(285 165) scale(1.1)"><use href="#flower"/></g>
 <g transform="translate(80 70) scale(.75)"><use href="#smallflower"/></g>
 <path d="M20 25 C160 80 245 190 370 305" fill="none" stroke="#86a9c8" stroke-width="8"/>
