 <ellipse cx="190" cy="320" rx="54" ry="24" transform="rotate(40 190 320)"/><ellipse cx="220" cy="390" rx="56" ry="24" transform="rotate(-32 220 390)"/>
 <ellipse cx="280" cy="445" rx="58" ry="25" transform="rotate(38 280 445)"/><ellipse cx="315" cy="520" rx="57" ry="25" transform="rotate(-32 315 520)"/>
 <ellipse cx="355" cy="565" rx="54" ry="24" transform="rotate(38 355 565)"/>
</g>
<g transform="translate(135 105) scale(1.5)"><use href="#flower"/></g>
<g transform="translate(275 165) scale(1.12)"><use href="#flower"/></g>
<g transform="translate(75 45) scale(.8)"><use href="#smallflower"/></g>
<g transform="translate(350 70) scale(.62)"><use href="#smallflower"/></g>
<path d="M20 25 Q125 20 215 58 Q305 92 400 45" fill="none" stroke="url(#gold)" stroke-width="4"/>
<path d="M45 70 Q120 40 195 65" fill="none" stroke="url(#gold)" stroke-width="2"/>

<!-- TOP RIGHT mirrored richness -->
<g transform="translate(1200 0) scale(-1 1)">
 <path d="M10 20 C190 90 250 250 355 410 C410 495 425 570 470 660" fill="none" stroke="#86a9c8" stroke-width="9" stroke-linecap="round"/>
 <path d="M40 125 C115 210 145 315 160 430" fill="none" stroke="#a9c3db" stroke-width="5"/>
 <g fill="url(#blue)" opacity=".78"><ellipse cx="115" cy="185" rx="48" ry="22" transform="rotate(42 115 185)"/><ellipse cx="145" cy="255" rx="53" ry="23" transform="rotate(-35 145 255)"/><ellipse cx="190" cy="320" rx="54" ry="24" transform="rotate(40 190 320)"/><ellipse cx="220" cy="390" rx="56" ry="24" transform="rotate(-32 220 390)"/><ellipse cx="280" cy="445" rx="58" ry="25" transform="rotate(38 280 445)"/><ellipse cx="315" cy="520" rx="57" ry="25" transform="rotate(-32 315 520)"/></g>
 <g transform="translate(135 105) scale(1.5)"><use href="#flower"/></g><g transform="translate(275 165) scale(1.12)"><use href="#flower"/></g><g transform="translate(75 45) scale(.8)"><use href="#smallflower"/></g><g transform="translate(350 70) scale(.62)"><use href="#smallflower"/></g>
 <path d="M20 25 Q125 20 215 58 Q305 92 400 45" fill="none" stroke="url(#gold)" stroke-width="4"/>
</g>

