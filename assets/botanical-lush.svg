<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800">
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeaf7"/><stop offset=".45" stop-color="#91b3d3"/><stop offset="1" stop-color="#4f7da9"/></linearGradient>
  <linearGradient id="blue2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#eaf3fa"/><stop offset=".5" stop-color="#a9c5df"/><stop offset="1" stop-color="#6d94bc"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ead9a9"/><stop offset=".5" stop-color="#c9a765"/><stop offset="1" stop-color="#f0dfb0"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  <g id="flower">
    <ellipse cx="0" cy="-30" rx="25" ry="38" fill="url(#blue2)" opacity=".92"/>
    <ellipse cx="27" cy="-10" rx="25" ry="38" transform="rotate(72 27 -10)" fill="url(#blue)" opacity=".9"/>
    <ellipse cx="17" cy="22" rx="25" ry="38" transform="rotate(145 17 22)" fill="#e8f1f8" opacity=".96"/>
    <ellipse cx="-17" cy="22" rx="25" ry="38" transform="rotate(-145 -17 22)" fill="#b5cce2" opacity=".92"/>
    <ellipse cx="-27" cy="-10" rx="25" ry="38" transform="rotate(-72 -27 -10)" fill="url(#blue)" opacity=".9"/>
    <circle cx="0" cy="0" r="12" fill="#d7bd80"/>
    <circle cx="0" cy="0" r="6" fill="#fff" opacity=".85"/>
  </g>
  <g id="smallflower">
    <circle cx="0" cy="-15" r="13" fill="#f7fbff" stroke="#9bb8d2" stroke-width="2"/>
    <circle cx="14" cy="-5" r="13" fill="#d6e5f1" stroke="#88a9c7" stroke-width="2"/>
    <circle cx="9" cy="11" r="13" fill="#f7fbff" stroke="#9bb8d2" stroke-width="2"/>
    <circle cx="-9" cy="11" r="13" fill="#c3d7e8" stroke="#88a9c7" stroke-width="2"/>
    <circle cx="-14" cy="-5" r="13" fill="#edf5fa" stroke="#9bb8d2" stroke-width="2"/>
    <circle r="6" fill="#d5b675"/>
  </g>
</defs>

<!-- faint watercolor clouds -->
<g fill="#c8dced" opacity=".23" filter="url(#soft)">
 <ellipse cx="250" cy="260" rx="250" ry="120"/><ellipse cx="950" cy="300" rx="260" ry="130"/>
 <ellipse cx="170" cy="1500" rx="300" ry="150"/><ellipse cx="1030" cy="1500" rx="300" ry="160"/>
</g>

<!-- TOP LEFT botanical sweep -->
<g fill="none" stroke-linecap="round">
 <path d="M10 20 C190 90 250 250 355 410 C410 495 425 570 470 660" stroke="#86a9c8" stroke-width="9"/>
 <path d="M40 125 C115 210 145 315 160 430" stroke="#a9c3db" stroke-width="5"/>
 <path d="M180 105 C240 175 275 270 300 355" stroke="#c8d9e7" stroke-width="4"/>
</g>
<g fill="url(#blue)" opacity=".78">
