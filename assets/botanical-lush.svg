 <g transform="translate(1200 0) scale(-1 1)">
  <g transform="translate(135 105) scale(1.65)"><use href="#flower"/></g><g transform="translate(285 165) scale(1.1)"><use href="#flower"/></g><g transform="translate(80 70) scale(.75)"><use href="#smallflower"/></g>
  <path d="M20 25 C160 80 245 190 370 305" fill="none" stroke="#86a9c8" stroke-width="8"/>
  <g fill="#87a9c8" opacity=".75"><ellipse cx="120" cy="185" rx="52" ry="22" transform="rotate(40 120 185)"/><ellipse cx="170" cy="245" rx="55" ry="23" transform="rotate(-35 170 245)"/><ellipse cx="235" cy="300" rx="55" ry="23" transform="rotate(40 235 300)"/></g>
 </g>
</g>

<!-- fine gold ornamental lines -->
<g fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".9">
 <path d="M430 55 Q600 5 770 55"/><path d="M430 1745 Q600 1795 770 1745"/>
 <path d="M65 820 Q600 780 1135 820"/><path d="M65 980 Q600 1020 1135 980"/>
</g>
</svg>